# MediShare deployment profile – NON-SECRET settings committed with the code.
# Priority: environment variables > Streamlit secrets > this file.
#
# The hosted site (https://medishare.streamlit.app) runs in PRODUCTION mode:
#   * no sample/demo data and no demo account picker
#   * sign-in requires proving ownership of an email address with a one-time code
#
# Secrets (SMTP_*, DATABASE_URL, BOOTSTRAP_SUPER_ADMIN_EMAIL, ANTHROPIC_API_KEY, ...) belong in
# Streamlit Cloud → App settings → Secrets – never in this file. See docs/DEPLOYMENT.md.
APP_ENV = "production"
AUTH_MODE = "email"
